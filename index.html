<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#163d2b" />
  <title>100 Putt Practice Tracker</title>
  <style>
    :root {
      --bg: #f4f7f3;
      --card: #ffffff;
      --text: #183127;
      --muted: #67776f;
      --green: #1f7a4d;
      --green-soft: #dff3e8;
      --red: #c94a4a;
      --red-soft: #fde7e7;
      --line: #dce5df;
      --shadow: 0 12px 30px rgba(20, 55, 38, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #eaf3ec 0, var(--bg) 280px);
    }

    button, input { font: inherit; }

    .wrap {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 24px 14px 56px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.65rem, 5vw, 2.6rem);
      line-height: 1.05;
    }

    .subtitle { margin: 0; color: var(--muted); }

    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .date-box label,
    .distance-box label {
      display: block;
      margin-bottom: 6px;
      font-size: .8rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    input[type="date"], input[type="text"] {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px 11px;
      background: #fff;
      color: var(--text);
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: end;
    }

    .btn {
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 750;
    }

    .btn-secondary { background: #edf1ee; color: var(--text); }
    .btn-danger { background: var(--red-soft); color: #8c2929; }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat { padding: 14px; text-align: center; }
    .stat strong { display: block; font-size: clamp(1.4rem, 5vw, 2.1rem); }
    .stat span { color: var(--muted); font-size: .85rem; }

    .progress {
      height: 12px;
      margin: 0 14px 14px;
      overflow: hidden;
      border-radius: 999px;
      background: #eef2ef;
    }

    .progress > div {
      height: 100%;
      width: 0;
      background: var(--green);
      transition: width .2s ease;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 0 14px 14px;
      color: var(--muted);
      font-size: .88rem;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }

    .grid-card { padding: 14px; }

    .putt-grid {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 7px;
    }

    .putt {
      aspect-ratio: 1;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #f8faf8;
      color: var(--text);
      cursor: pointer;
      font-weight: 800;
      transition: transform .08s ease, background .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .putt:active { transform: scale(.94); }
    .putt.made { background: var(--green-soft); border-color: #83c7a2; color: #125c38; }
    .putt.missed { background: var(--red-soft); border-color: #eda7a7; color: #9d3030; }

    .putt small {
      display: block;
      margin-top: 1px;
      font-size: .72rem;
      line-height: 1;
    }

    .history {
      margin-top: 14px;
      padding: 16px;
    }

    .history h2 { margin: 0 0 12px; font-size: 1.15rem; }
    .history-list { display: grid; gap: 8px; }

    .history-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      cursor: pointer;
    }

    .history-row:hover { background: #f8faf8; }
    .history-row .score { font-weight: 800; }
    .history-row .rate { color: var(--muted); }
    .empty { color: var(--muted); padding: 8px 0; }

    .note {
      margin: 14px 2px 0;
      color: var(--muted);
      font-size: .82rem;
      text-align: center;
    }

    @media (max-width: 640px) {
      .toolbar { grid-template-columns: 1fr; }
      .actions { align-items: stretch; }
      .actions .btn { flex: 1; }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .putt-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
      .putt { border-radius: 12px; font-size: 1rem; }
      .history-row { grid-template-columns: 1fr auto; }
      .history-row .rate { grid-column: 2; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>100 Putt Practice</h1>
        <p class="subtitle">Tap each number: blank → made ✓ → missed ×</p>
      </div>
    </header>

    <section class="card toolbar" aria-label="Practice settings">
      <div class="date-box">
        <label for="practiceDate">Practice date</label>
        <input id="practiceDate" type="date" />
      </div>
      <div class="actions">
        <button id="clearDay" class="btn btn-danger" type="button">Clear day</button>
        <button id="todayBtn" class="btn btn-secondary" type="button">Today</button>
      </div>
    </section>

    <section class="card" aria-label="Daily summary">
      <div class="summary">
        <div class="stat"><strong id="madeCount">0</strong><span>Made</span></div>
        <div class="stat"><strong id="missedCount">0</strong><span>Missed</span></div>
        <div class="stat"><strong id="remainingCount">100</strong><span>Remaining</span></div>
        <div class="stat"><strong id="successRate">0%</strong><span>Success rate</span></div>
      </div>
      <div class="progress" aria-label="Completion progress"><div id="progressBar"></div></div>
      <div class="legend">
        <span><i class="dot" style="background:#dff3e8"></i>Made</span>
        <span><i class="dot" style="background:#fde7e7"></i>Missed</span>
        <span>Results save automatically on this device.</span>
      </div>
    </section>

    <section class="card grid-card" style="margin-top:14px">
      <div id="puttGrid" class="putt-grid" aria-label="Putt results 1 to 100"></div>
    </section>

    <section class="card history">
      <h2>Practice history</h2>
      <div id="historyList" class="history-list"></div>
    </section>

    <p class="note">Your records are stored in this browser. Clearing browser data will remove them.</p>
  </main>

  <script>
    const STORAGE_KEY = 'practiceGolf.putting.v1';
    const dateInput = document.getElementById('practiceDate');
    const grid = document.getElementById('puttGrid');
    const historyList = document.getElementById('historyList');
    const madeCount = document.getElementById('madeCount');
    const missedCount = document.getElementById('missedCount');
    const remainingCount = document.getElementById('remainingCount');
    const successRate = document.getElementById('successRate');
    const progressBar = document.getElementById('progressBar');

    function localDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function loadStore() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveStore(store) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    }

    function getDayResults() {
      const store = loadStore();
      const date = dateInput.value;
      if (!Array.isArray(store[date])) store[date] = Array(100).fill(null);
      return { store, results: store[date] };
    }

    function cycleResult(index) {
      const { store, results } = getDayResults();
      const current = results[index];
      results[index] = current === null ? 'made' : current === 'made' ? 'missed' : null;
      store[dateInput.value] = results;
      saveStore(store);
      render();
    }

    function renderGrid(results) {
      grid.innerHTML = '';
      results.forEach((result, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `putt${result ? ` ${result}` : ''}`;
        button.setAttribute('aria-label', `Putt ${index + 1}: ${result || 'not recorded'}`);
        button.innerHTML = `${index + 1}<small>${result === 'made' ? '✓' : result === 'missed' ? '×' : '·'}</small>`;
        button.addEventListener('click', () => cycleResult(index));
        grid.appendChild(button);
      });
    }

    function renderSummary(results) {
      const made = results.filter(v => v === 'made').length;
      const missed = results.filter(v => v === 'missed').length;
      const completed = made + missed;
      const rate = completed ? Math.round((made / completed) * 100) : 0;

      madeCount.textContent = made;
      missedCount.textContent = missed;
      remainingCount.textContent = 100 - completed;
      successRate.textContent = `${rate}%`;
      progressBar.style.width = `${completed}%`;
    }

    function formatDate(dateString) {
      return new Intl.DateTimeFormat(undefined, {
        year: 'numeric', month: 'short', day: 'numeric'
      }).format(new Date(`${dateString}T12:00:00`));
    }

    function renderHistory() {
      const store = loadStore();
      const rows = Object.entries(store)
        .map(([date, results]) => {
          if (!Array.isArray(results)) return null;
          const made = results.filter(v => v === 'made').length;
          const missed = results.filter(v => v === 'missed').length;
          const completed = made + missed;
          const rate = completed ? Math.round((made / completed) * 100) : 0;
          return { date, made, completed, rate };
        })
        .filter(Boolean)
        .filter(row => row.completed > 0)
        .sort((a, b) => b.date.localeCompare(a.date));

      historyList.innerHTML = '';
      if (!rows.length) {
        historyList.innerHTML = '<div class="empty">No practice recorded yet.</div>';
        return;
      }

      rows.forEach(row => {
        const item = document.createElement('div');
        item.className = 'history-row';
        item.tabIndex = 0;
        item.innerHTML = `
          <span>${formatDate(row.date)}</span>
          <span class="score">${row.made}/${row.completed}</span>
          <span class="rate">${row.rate}%</span>`;
        const openDate = () => {
          dateInput.value = row.date;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        item.addEventListener('click', openDate);
        item.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') openDate();
        });
        historyList.appendChild(item);
      });
    }

    function render() {
      const { results } = getDayResults();
      renderGrid(results);
      renderSummary(results);
      renderHistory();
    }

    document.getElementById('todayBtn').addEventListener('click', () => {
      dateInput.value = localDateString();
      render();
    });

    document.getElementById('clearDay').addEventListener('click', () => {
      const date = dateInput.value;
      if (!confirm(`Clear all results for ${formatDate(date)}?`)) return;
      const store = loadStore();
      delete store[date];
      saveStore(store);
      render();
    });

    dateInput.addEventListener('change', render);
    dateInput.value = localDateString();
    render();
  </script>
</body>
</html>
